name: Versioned pack release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - pack/**
      - bin/harklight_pack.py
      - tools/release.py
      - tools/privacy_check.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public files and release notes
        run: python3 tools/privacy_check.py --ci
      - name: Publish versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py
